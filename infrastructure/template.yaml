AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: DECIVANTA sponsor-backed decision-cycle API

Globals:
  HttpApi:
    CorsConfiguration:
      AllowOrigins:
        - http://127.0.0.1:3100
        - http://localhost:3100
        - https://judge.d2mer8s8oyexv3.amplifyapp.com
      AllowHeaders:
        - authorization
        - content-type
      AllowMethods:
        - POST
        - OPTIONS

Parameters:
  McpSecretArn:
    Type: String
    NoEcho: true
  SqlSecretArn:
    Type: String
    NoEcho: true

Resources:
  ManagedMcpSpikeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: decivanta-managed-mcp-spike
      Runtime: nodejs24.x
      Handler: index.handler
      CodeUri: ../dist/
      MemorySize: 256
      Timeout: 30
      Events:
        HttpApi:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY
      Environment:
        Variables:
          MCP_SECRET_ARN: !Ref McpSecretArn
          SQL_SECRET_ARN: !Ref SqlSecretArn
          MCP_ENDPOINT: https://cockroachlabs.cloud/mcp
          EMBEDDING_MODEL_ID: amazon.titan-embed-text-v2:0
          GUIDANCE_MODEL_ID: amazon.nova-lite-v1:0
      Policies:
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Ref McpSecretArn
                - !Ref SqlSecretArn
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/amazon.titan-embed-text-v2:0
                - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/amazon.nova-lite-v1:0

Outputs:
  DecisionCycleFunctionName:
    Value: !Ref ManagedMcpSpikeFunction
  DecisionCycleApiUrl:
    Value: !Sub https://${ServerlessHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
